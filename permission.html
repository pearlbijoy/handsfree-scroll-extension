<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f1116;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .permission-card {
      background: rgba(30, 34, 42, 0.9);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 32px;
      width: 320px;
      text-align: center;
      color: #e5e7eb;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    }
    .permission-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 16px;
      color: #4a90e2;
    }
    h3 {
      margin: 0 0 8px;
      font-size: 18px;
    }
    p {
      font-size: 13px;
      color: #94a3b8;
      margin: 0 0 20px;
      line-height: 1.5;
    }
    button {
      background: #4a90e2;
      border: none;
      color: white;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 24px;
      border-radius: 10px;
      cursor: pointer;
    }
    button:hover { background: #3a7bc8; }
  </style>
  <script src="permission.js" defer></script>
</head>
<body>
  <div class="permission-card">
    <svg class="permission-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13.997 4a2 2 0 0 1 1.76 1.05l.486.9A2 2 0 0 0 18.003 7H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1.997a2 2 0 0 0 1.759-1.048l.489-.904A2 2 0 0 1 10.004 4z"/>
      <circle cx="12" cy="13" r="3"/>
    </svg>
    <h3>Camera Access Needed</h3>
    <p>HoverNav uses your camera to track hand gestures for browsing. Nothing is recorded or sent anywhere -detection happens entirely on your device.</p>
    <button id="enable-btn">Enable Camera</button>
  </div>
</body>
</html>
